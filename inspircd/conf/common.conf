<admin
    name="Admin"
    nick="Admin"
    email="admin@wetfish.local">

<bind address="" port="6667" type="clients">
<bind address="" port="7000" type="servers">

<connect
    allow="*"
    timeout="60"
    pingfreq="120"
    hardsendq="1048576"
    softsendq="8192"
    recvq="8192"
    threshold="10"
    commandrate="1000"
    localmax="50"
    globalmax="50">

<class
    name="default"
    commands="*"
    usermodes="*"
    chanmodes="*">

<oper
    name="admin"
    password="admin"
    host="*"
    type="NetAdmin">

<type
    name="NetAdmin"
    classes="default"
    host="admin.wetfish.local">

<files motd="motd.txt">

<channels
    users="20"
    opers="60">

<options
    prefixquit="Quit: "
    suffixquit=""
    prefixpart="&quot;"
    suffixpart="&quot;"
    syntaxhints="yes"
    casemapping="rfc1459"
    cyclehostsonchange="yes">

<performance
    netbuffersize="10240"
    somaxconn="128"
    softlimit="12800">

<security
    announceinvites="dynamic"
    hidemodes="eI"
    flatlinks="no"
    hidewhois=""
    hidebans="no"
    hidekills=""
    hidesplits="no"
    maxtargets="20"
    customversion=""
    genericoper="no"
    userstats="">

<limits
    maxnick="32"
    maxchan="64"
    maxmodes="20"
    maxident="11"
    maxquit="255"
    maxtopic="307"
    maxkick="255"
    maxreal="128"
    maxaway="200">

<log method="file" type="*" level="default" target="ircd.log">
<log method="stdout" type="*" level="default">
