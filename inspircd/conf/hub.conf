<server
    name="hub.wetfish.local"
    description="Wetfish Hub"
    network="Wetfish">

<include file="common.conf">

<module name="spanningtree">

<link name="leaf1.wetfish.local"
    ipaddr="leaf1"
    port="7000"
    allowmask="*"
    sendpass="hub2leaf"
    recvpass="leaf2hub">

<link name="leaf2.wetfish.local"
    ipaddr="leaf2"
    port="7000"
    allowmask="*"
    sendpass="hub2leaf"
    recvpass="leaf2hub">
