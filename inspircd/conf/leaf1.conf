<server
    name="leaf1.wetfish.local"
    description="Wetfish Leaf 1"
    network="Wetfish">

<include file="common.conf">

<module name="spanningtree">

<link name="hub.wetfish.local"
    ipaddr="hub"
    port="7000"
    allowmask="*"
    sendpass="leaf2hub"
    recvpass="hub2leaf">

<autoconnect period="15" server="hub.wetfish.local">
